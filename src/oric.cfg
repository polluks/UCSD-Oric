# ld65 configuration for SYSTEM.ORIC

MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    BIOS:   start = $C000, size = $1000, file = %O, fill = yes, fillval = $00;
    INTERP: start = $D000, size = $2000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BIOS:     load = BIOS,   type = ro;
    RODATA:   load = BIOS,   type = ro;
    BIOSDATA: load = BIOS,   type = rw;
    DATA:     load = INTERP, type = rw;
    CODE:     load = INTERP, type = ro;
    BSS:      load = INTERP, type = bss;
}
