# ld65 configuration for SYSTEM.ORIC

MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    BIOS:   start = $C000, size = $1000, file = %O;
    INTERP: start = $D000, size = $3000, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    BIOS:     load = BIOS,     type = ro;
    BIOSDATA: load = BIOS,     type = rw;
    CODE:     load = INTERP,   type = ro;
}
